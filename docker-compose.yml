# Docker Compose configuration for Highlight Helper
# Production-ready with restart policies, health checks, and logging

services:
  highlight-helper:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: highlight-helper

    # Make host.docker.internal work on Linux
    extra_hosts:
      - "host.docker.internal:host-gateway"

    # Port mapping: host:container
    # Default production port is 18742 for consistency
    ports:
      - "18742:8000"

    # Volume mounts for persistent data
    volumes:
      # Database persistence
      - ./data:/app/data
      # Database backups
      - ./backups:/app/backups
      # SSL certificates (optional, for HTTPS)
      - ./certs:/app/certs:ro

    # Environment variables
    env_file:
      - .env

    # Override database path for container
    environment:
      - DATABASE_URL=sqlite+aiosqlite:///./data/highlight_helper.db
      - ENVIRONMENT=production
      # Root path for subpath deployment (e.g., /highlights via Tailscale Serve)
      - ROOT_PATH=/highlights
      # OpenTelemetry tracing - send to global Jaeger
      - OTEL_ENABLED=true
      - OTEL_EXPORTER=otlp
      - OTEL_ENDPOINT=http://host.docker.internal:4317
      - OTEL_SERVICE_NAME=highlight-helper

    # Restart policy: always restart unless explicitly stopped
    restart: unless-stopped

    # Health check configuration
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      start_period: 10s
      retries: 3

    # Logging configuration: send to journald for centralized logging
    logging:
      driver: journald
      options:
        tag: highlight-helper

# Named volumes (alternative to bind mounts if preferred)
# Uncomment to use Docker-managed volumes instead of bind mounts
# volumes:
#   highlight-data:
#   highlight-certs:
