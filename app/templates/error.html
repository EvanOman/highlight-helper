{% extends "layouts/base.html" %}

{% block title %}{{ status_code }} - {{ detail }}{% endblock %}

{% block content %}
<div class="flex flex-col items-center justify-center py-16 sm:py-24">
    <div class="text-6xl sm:text-8xl font-bold text-gray-300 dark:text-gray-600 mb-4">{{ status_code }}</div>
    <h1 class="text-xl sm:text-2xl font-semibold text-gray-700 dark:text-gray-300 mb-2">{{ detail }}</h1>
    <a href="{{ base_path }}/"
       class="mt-6 inline-flex items-center gap-2 bg-primary-600 hover:bg-primary-700 text-white px-4 py-2 rounded-lg transition">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
            <path fill-rule="evenodd" d="M9.707 16.707a1 1 0 01-1.414 0l-6-6a1 1 0 010-1.414l6-6a1 1 0 011.414 1.414L5.414 9H17a1 1 0 110 2H5.414l4.293 4.293a1 1 0 010 1.414z" clip-rule="evenodd" />
        </svg>
        Back to Books
    </a>
</div>
{% endblock %}
